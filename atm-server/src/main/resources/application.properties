# ===== Application =====
spring.application.name=atm-server

# ===== Server =====
# Backend port. Keep it in sync with atm-app/lib/api.dart (baseUrl).
server.port=8081

# ===== DataSource =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/atm_db?useUnicode=true&characterEncoding=UTF-8&sslMode=DISABLED&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
# DB password: 123456 is the default for local dev (MySQL listens on localhost only).
# Override it with env var DB_PASSWORD when deploying; never commit the real password.
spring.datasource.password=${DB_PASSWORD:123456}

# ===== MyBatis =====
# package of entity classes -> lets XML use short class name in resultType
mybatis.type-aliases-package=com.atm.entity
# where the mapper XML files live (MUST be under src/main/resources, otherwise Maven will not copy them)
mybatis.mapper-locations=classpath:mapper/*.xml
# map DB snake_case column to Java camelCase property: customer_no -> customerNo
mybatis.configuration.map-underscore-to-camel-case=true
# print executed SQL to console -- development only, disable in production
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== Logging =====
logging.level.com.atm=debug

# ===== JWT =====
# Signing key injected from env var JWT_SECRET. Length MUST be >= 32 chars
# (>= 48 chars selects HS384), otherwise jjwt throws WeakKeyException.
#
# !! No real secret lives in this repo. The default below is an obvious placeholder:
#    - local demo: works (sign and verify OK), but the key is public, so local machine only
#    - deployment: you MUST set JWT_SECRET=<your own long random string>
#    - the old secret committed earlier in history is treated as leaked and is now revoked
atm.jwt.secret=${JWT_SECRET:CHANGE_ME_use_env_var_JWT_SECRET_32chars_minimum_0000}
# Token TTL: 2 hours, in milliseconds
atm.jwt.expire=7200000